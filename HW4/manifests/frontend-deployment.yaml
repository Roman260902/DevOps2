apiVersion: apps/v1
kind: Deployment

metadata:
  name: counter-frontend
  namespace: counter
  annotations:
    kubernetes.io/change-cause: "Frontend hw4-v2: change button label"

spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 120

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: counter-frontend

  template:
    metadata:
      labels:
        app: counter-frontend

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: frontend
          image: counter-frontend:hw4-v2
          imagePullPolicy: Never

          env:
            - name: HOSTNAME
              value: "0.0.0.0"

            - name: PORT
              value: "8080"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5
