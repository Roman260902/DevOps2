apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-scaler
  namespace: counter

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-scaler
  namespace: counter

rules:
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    resourceNames:
      - counter-frontend
    verbs:
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-scaler
  namespace: counter

subjects:
  - kind: ServiceAccount
    name: frontend-scaler
    namespace: counter

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frontend-scaler
