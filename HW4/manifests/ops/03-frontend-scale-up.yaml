apiVersion: batch/v1
kind: CronJob
metadata:
  name: frontend-scale-up
  namespace: counter

spec:
  schedule: "0 9 * * *"
  timeZone: Europe/Moscow

  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 90

      template:
        spec:
          serviceAccountName: frontend-scaler
          automountServiceAccountToken: true
          restartPolicy: Never

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: scaler
              image: curlimages/curl:8.23.0
              imagePullPolicy: IfNotPresent

              env:
                - name: REPLICAS
                  value: "3"

              command:
                - sh
                - -eu
                - -c
                - |
                  case "$REPLICAS" in
                    1|3) ;;
                    *) echo "Invalid replica count"; exit 1 ;;
                  esac

                  sa=/var/run/secrets/kubernetes.io/serviceaccount

                  curl \
                    --silent \
                    --show-error \
                    --fail-with-body \
                    --connect-timeout 5 \
                    --max-time 30 \
                    --noproxy '*' \
                    --cacert "$sa/ca.crt" \
                    --header "Authorization: Bearer $(cat "$sa/token")" \
                    --header "Content-Type: application/merge-patch+json" \
                    --request PATCH \
                    --data "{\"spec\":{\"replicas\":${REPLICAS}}}" \
                    https://kubernetes.default.svc/apis/apps/v1/namespaces/counter/deployments/counter-frontend/scale

                  printf '\nRequested frontend replicas: %s\n' "$REPLICAS"

              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
