apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: counter-postgres
  namespace: counter
spec:
  serviceName: counter-postgres
  replicas: 1

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  selector:
    matchLabels:
      app: counter-postgres

  template:
    metadata:
      labels:
        app: counter-postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      containers:
        - name: postgres
          image: postgres:18.6-bookworm
          imagePullPolicy: Never

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_DB
              value: counterdb

            - name: POSTGRES_USER
              value: counteradmin

            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres/password

            - name: PGDATA
              value: /var/lib/postgresql/18/docker

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -h 127.0.0.1 -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql

            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

            - name: postgres-password
              mountPath: /run/secrets/postgres
              readOnly: true

      volumes:
        - name: init-sql
          configMap:
            name: counter-postgres-init

        - name: postgres-password
          secret:
            secretName: counter-postgres-secret
            defaultMode: 0444
            items:
              - key: password
                path: password

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
