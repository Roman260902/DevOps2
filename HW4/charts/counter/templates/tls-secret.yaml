apiVersion: v1
kind: Secret
metadata:
  name: {{ include "counter.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "counter.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ required "Pass tls.crt with --set-file" .Values.tls.crt | b64enc | quote }}
  tls.key: {{ required "Pass tls.key with --set-file" .Values.tls.key | b64enc | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "counter.fullname" . }}-tls-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "counter.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- required "Pass tls.caCrt with --set-file" .Values.tls.caCrt | nindent 4 }}
