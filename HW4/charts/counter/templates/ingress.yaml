apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "counter.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "counter.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ required "Set ingress.host" .Values.ingress.host | quote }}
      secretName: {{ include "counter.fullname" . }}-tls
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "counter.fullname" . }}-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "counter.fullname" . }}-frontend
                port:
                  name: http
