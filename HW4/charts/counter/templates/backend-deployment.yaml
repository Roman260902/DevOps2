apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "counter.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "counter.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: {{ .Values.rollout.revisionHistoryLimit }}
  minReadySeconds: {{ .Values.rollout.minReadySeconds }}
  progressDeadlineSeconds: {{ .Values.rollout.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollout.maxSurge }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "counter.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "counter.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.rollout.terminationGracePeriodSeconds }}
      containers:
        - name: backend
          image: {{ printf "%s:%s" .Values.backend.image.repository .Values.backend.image.tag | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "counter.fullname" . }}-backend-config
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os
                  import urllib.request
                  urllib.request.urlopen(
                      "http://127.0.0.1:" + os.environ["PORT"] + "/api/counter",
                      timeout=1
                  ).close()
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os
                  import urllib.request
                  if os.path.exists("/tmp/force-unready"):
                      raise SystemExit(1)
                  urllib.request.urlopen(
                      "http://127.0.0.1:" + os.environ["PORT"] + "/api/counter",
                      timeout=1
                  ).close()
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os
                  import urllib.request
                  urllib.request.urlopen(
                      "http://127.0.0.1:" + os.environ["PORT"] + "/api/counter",
                      timeout=1
                  ).close()
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
