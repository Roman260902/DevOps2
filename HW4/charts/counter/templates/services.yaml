apiVersion: v1
kind: Service
metadata:
  name: {{ include "counter.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "counter.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "counter.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.servicePort }}
      targetPort: {{ .Values.backend.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "counter.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "counter.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "counter.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.servicePort }}
      targetPort: http
