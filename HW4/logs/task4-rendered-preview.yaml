apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-backend
  namespace: hw4-helm
  labels:
    app.kubernetes.io/name: counter
    app.kubernetes.io/instance: alpha
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "counter-0.1.0"
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: counter
      app.kubernetes.io/instance: alpha
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: counter
        app.kubernetes.io/instance: alpha
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: "70eaf36e67901bcca961f3017b9306bea43300bfb823c0b3cf7dc35762d1924c"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: "counter-backend:hw4-v1"
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: alpha-backend-config
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          startupProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os
                  import urllib.request
                  urllib.request.urlopen(
                      "http://127.0.0.1:" + os.environ["PORT"] + "/api/counter",
                      timeout=1
                  ).close()
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os
                  import urllib.request
                  if os.path.exists("/tmp/force-unready"):
                      raise SystemExit(1)
                  urllib.request.urlopen(
                      "http://127.0.0.1:" + os.environ["PORT"] + "/api/counter",
                      timeout=1
                  ).close()
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os
                  import urllib.request
                  urllib.request.urlopen(
                      "http://127.0.0.1:" + os.environ["PORT"] + "/api/counter",
                      timeout=1
                  ).close()
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
