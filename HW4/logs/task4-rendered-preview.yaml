# Source: counter/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alpha-ingress
  namespace: hw4-helm
  labels:
    app.kubernetes.io/name: counter
    app.kubernetes.io/instance: alpha
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "counter-0.1.0"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: "traefik"
  tls:
    - hosts:
        - "alpha.localtest.me"
      secretName: alpha-tls
  rules:
    - host: "alpha.localtest.me"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: alpha-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alpha-frontend
                port:
                  name: http
---
# Source: counter/templates/smoke-test.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: alpha-smoke
  namespace: hw4-helm
  labels:
    app.kubernetes.io/name: counter
    app.kubernetes.io/instance: alpha
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "counter-0.1.0"
    app.kubernetes.io/component: smoke-test
  annotations:
    helm.sh/hook: post-install,post-upgrade,post-rollback,test
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: counter
        app.kubernetes.io/instance: alpha
        app.kubernetes.io/component: smoke-test
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: "curlimages/curl:8.23.0"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -eu
            - -c
            - |
              request() {
                curl --silent --show-error --fail \
                  --retry 10 --retry-delay 2 --retry-all-errors \
                  --connect-timeout 3 --max-time 10 \
                  --noproxy '*' "$@"
              }

              body="$(request "$BACKEND_URL/api/counter")"
              printf '%s\n' "$body" | grep -Eq '"count"[[:space:]]*:[[:space:]]*[0-9]+'
              printf 'PASS backend Service: %s\n' "$body"

              request --output /dev/null "$FRONTEND_URL/"
              printf 'PASS frontend Service\n'

              request --output /dev/null \
                --cacert /etc/counter-ca/ca.crt \
                --connect-to "$INGRESS_HOST:443:$INGRESS_SERVICE:$INGRESS_PORT" \
                "https://$INGRESS_HOST/"
              printf 'PASS HTTPS frontend: %s\n' "$INGRESS_HOST"

              body="$(request \
                --cacert /etc/counter-ca/ca.crt \
                --connect-to "$INGRESS_HOST:443:$INGRESS_SERVICE:$INGRESS_PORT" \
                "https://$INGRESS_HOST/api/counter")"
              printf '%s\n' "$body" | grep -Eq '"count"[[:space:]]*:[[:space:]]*[0-9]+'
              printf 'PASS HTTPS API: %s\n' "$body"
              printf 'PASS release smoke test\n'
          env:
            - name: BACKEND_URL
              value: "http://alpha-backend:80"
            - name: FRONTEND_URL
              value: "http://alpha-frontend:80"
            - name: INGRESS_HOST
              value: "alpha.localtest.me"
            - name: INGRESS_SERVICE
              value: "traefik.traefik.svc.cluster.local"
            - name: INGRESS_PORT
              value: "443"
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ca
              mountPath: /etc/counter-ca
              readOnly: true
      volumes:
        - name: ca
          configMap:
            name: alpha-tls-ca
