---
postgres__version: "18"
postgres__data_dir: /data/postgres/data
postgres__service_name: postgresql-course.service

postgres__opts:
  listen_addresses: "'127.0.0.1'"
  port: 5432
  max_connections: 100
  password_encryption: "'scram-sha-256'"
  unix_socket_directories: "'/var/run/postgresql'"

postgres__hba:
  - type: local
    database: all
    user: postgres
    method: peer

  - type: local
    database: all
    user: postgres_exporter
    method: peer

  - type: local
    database: all
    user: all
    method: scram-sha-256

  - type: host
    database: all
    user: all
    address: 127.0.0.1/32
    method: scram-sha-256

postgres__users: []
postgres__databases: []

postgres__exporter_version: "0.20.1"
postgres__exporter_arch: amd64
postgres__exporter_port: 9187
# defaults file for roles/postgres
